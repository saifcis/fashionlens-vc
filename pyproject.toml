[project]
name = "fashionlens"
version = "0.1.0"
description = "Multimodal fashion discovery engine"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.15.0+cpu",
    "torchvision==0.29.2+cpu",
    "transformers==5.24.1",
    "datasets==5.2.0",
    "pillow==13.0.0",
    "numpy==2.5.5",
    "pandas==3.1.1",
    "rapidfuzz==3.14.6",
    "streamlit==1.67.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
