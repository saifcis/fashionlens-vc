[theme]
base = "light"
primaryColor = "#111111"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F5F5"
textColor = "#111111"
borderColor = "#E5E5E5"
baseRadius = "0.2rem"
font = "Arial, Helvetica, sans-serif"

[client]
toolbarMode = "minimal"

[server]
maxUploadSize = 5

[browser]
gatherUsageStats = false
